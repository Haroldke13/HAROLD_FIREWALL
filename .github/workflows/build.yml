name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build Linux binary
        run: |
          pip install -r requirements.txt
          pyinstaller --onefile --name HAROLD_FIREWALL-linux main.py
          mkdir -p out
          tar -C dist -czf out/HAROLD_FIREWALL-linux-x86_64.tar.gz HAROLD_FIREWALL-linux
          tar -czf out/HAROLD_FIREWALL-linux-helper.tar.gz linux policy
          cd out && sha256sum *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build Windows exe and installer
        shell: pwsh
        run: |
          pip install -r requirements.txt
          pyinstaller --onefile --windowed --name HAROLD_FIREWALL main.py
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\HAROLD_FIREWALL.exe out\HAROLD_FIREWALL.exe
          Copy-Item dist\HAROLD_FIREWALL-Setup.exe out\HAROLD_FIREWALL-Setup.exe
          Get-ChildItem out\*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Set-Content out\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build macOS app
        run: |
          pip install -r requirements.txt
          pyinstaller --windowed --name HAROLD_FIREWALL main.py
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/HAROLD_FIREWALL.app out/HAROLD_FIREWALL-macos.zip
          cd out && shasum -a 256 *.zip > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build APK
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool pkg-config cmake
          pip install buildozer cython==0.29.36
          buildozer -v android debug
          mkdir -p out
          cp bin/*.apk out/HAROLD_FIREWALL-android-debug.apk
          cd out && sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd files
          gh release create "${GITHUB_REF_NAME}" * --title "HAROLD_FIREWALL ${GITHUB_REF_NAME}" \
            --notes "Builds for Linux, Windows, macOS and Android. Verify files with the SHA256SUMS-*.txt files. Windows and macOS builds are unsigned; the Android APK is a debug build."
